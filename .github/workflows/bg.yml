name: Photos de fond (candidates)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bg.yml']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request
          UA = {'User-Agent': 'OnygoBot/1.0 (https://github.com/melanie01630/onygo; contact via GitHub) python-urllib'}
          os.makedirs('tmp-bg', exist_ok=True)
          out = []
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          titles = ['Bora Bora', 'Maldives', 'Seychelles', 'Whitehaven Beach', 'Navagio', 'Aitutaki', 'Anse Source d\'Argent', 'El Nido, Palawan', 'Turks and Caicos Islands', 'Lagoon']
          for t in titles:
              try:
                  q = urllib.parse.urlencode({'action': 'query', 'format': 'json', 'prop': 'pageimages|pageprops', 'piprop': 'thumbnail|name', 'pithumbsize': 1600, 'redirects': 1, 'titles': t})
                  raw = get('https://en.wikipedia.org/w/api.php?' + q)
                  p = list(json.loads(raw)['query']['pages'].values())[0]
                  src = p.get('thumbnail', {}).get('source'); name = p.get('pageimage')
                  f = 'tmp-bg/' + t.replace(' ', '_').replace("'", '').replace(',', '') + '.jpg'
                  if src:
                      open(f, 'wb').write(get(src))
                  out.append({'title': t, 'file': name, 'src': src, 'saved': f if src else None})
              except Exception as e:
                  out.append({'title': t, 'error': str(e)[:200]})
              time.sleep(1.5)
          json.dump(out, open('tmp-bg/list.json', 'w'), indent=1)
          print(json.dumps(out, indent=1))
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-bg && git commit -m "Candidates photos de fond (océan turquoise)" && git pull --rebase origin main && git push origin HEAD:main
