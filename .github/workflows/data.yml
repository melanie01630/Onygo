name: Données des villes populaires
on:
  push:
    branches: [main]
    paths: ['scripts/build-data.mjs', '.github/workflows/data.yml', 'data/cities.json']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer les villes
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
          FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/build-data.mjs
